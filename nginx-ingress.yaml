# Ingress terminating TLS using the cert-manager-issued `nginx-tls` secret.
# Requires an ingress controller in the cluster (e.g. ingress-nginx). If you didn't
# install one, the secondary/fallback for the demo is to expose the Service via
# NodePort and curl it directly — mention that fallback in the demo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: web
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - nginx.web.example.com
      secretName: nginx-tls        # produced by cert-manager (manifest 07)
  rules:
    - host: nginx.web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
