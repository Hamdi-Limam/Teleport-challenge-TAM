apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-deployer
  namespace: web
rules:
  # Manage the application workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pods + logs = "access and monitor" the app
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]            # exec into a pod for live debugging
  # Service + ConfigMap needed to serve the static site
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # cert-manager Certificate + Ingress so the user can wire up TLS for the site
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only on events to triage their own deployment
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
