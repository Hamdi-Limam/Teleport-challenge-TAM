apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: web
  labels: { app: nginx }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101              # nginx unprivileged uid in the official image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginx:1.27-alpine  # pinned for reproducibility
          ports:
            - containerPort: 8080    # unprivileged port; see configmap note below
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: site,      mountPath: /usr/share/nginx/html }
            - { name: conf,      mountPath: /etc/nginx/conf.d }
            - { name: cache,     mountPath: /var/cache/nginx }
            - { name: run,       mountPath: /var/run }
      volumes:
        - name: site
          configMap: { name: nginx-static-site }
        - name: conf
          configMap: { name: nginx-listen-conf }
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
# Override the default server block so nginx listens on 8080 as non-root.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-listen-conf
  namespace: web
data:
  default.conf: |
    server {
      listen       8080;
      server_name  _;
      location / {
        root   /usr/share/nginx/html;
        index  index.html;
      }
    }
